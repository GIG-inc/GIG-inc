[package]
name = "r_api_gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = { version =  "0.13", features = ["transport"] }
prost = "0.13"
tokio = {version = "1.49.0", features = ["sync", "rt-multi-thread", "macros"]}
anyhow = "1.0.100"
dotenvy = "0.15.7"
axum = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }

[build-dependencies]
tonic-build = "0.13"
